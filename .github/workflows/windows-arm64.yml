# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

on:
  # Optimised PDF: run by hand only (Actions > Run workflow), to save private-repo minutes.
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@840a417e3de8198bdd99a87c8cafd5993a92c76f
    with:
      app-name: pdfcraft
      app-dir: PdfCraft
      install-relative-path: Programs/ArtCraft/PdfCraft
      install-scope: perUser
